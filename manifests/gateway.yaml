apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: speedtest-gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: speedtest-tls
      allowedRoutes:
        namespaces:
          from: Same
